[env:waveshare_s3_eth]
platform = espressif32
framework = arduino
build_src_filter = +<*.cpp> +<snmp/*.cpp> +<*.ino> -<com-arduino.cpp> -<backend-sdcard-teensy41.cpp>
monitor_speed = 115200
upload_speed = 500000
board_build.filesystem = littlefs
board_build.size = 0.1M
lib_deps = greiman/SdFat
	bblanchon/ArduinoJson
	sstaub/NTP
	adafruit/Adafruit SSD1306@^2.5.17
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.extra_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
build_flags = -DESP32 -DWAVESHARE_ESP32_ETH -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue -fexceptions -DIESP_VERSION=\"3.0\"
# -DCORE_DEBUG_LEVEL=5 -DARDUHAL_LOG_LEVEL=5
build_unflags = -std=gnu++11 -Os
extra_scripts = pre:prepare.py
